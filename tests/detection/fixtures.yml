# Linux host. Normalization gives event.action only when journald confirms the program.
auth_sudo_failed:
  match:
    - {event: {dataset: linux.auth, action: sudo-auth-failed}, user: {name: alice}}
    - {event: {dataset: linux.auth, action: sudo-not-permitted}, user: {name: bob}}
  no_match:
    - {event: {dataset: linux.auth, action: sudo-command}, user: {name: alice}}
    - {event: {dataset: linux.system, action: sudo-auth-failed}}
    - {event: {dataset: linux.auth, action: unverified-log-entry}, labels: {attribution: unverified}}

auth_sudo_command:
  match:
    - {event: {dataset: linux.auth, action: sudo-command}, user: {name: alice}}
  no_match:
    - {event: {dataset: linux.auth, action: sudo-auth-failed}}
    - {event: {dataset: linux.auth, action: unverified-log-entry}}

auth_user_created:
  match:
    - {event: {dataset: linux.auth, action: user-created}, user: {target: {name: mallory}}}
  no_match:
    - {event: {dataset: linux.auth, action: user-deleted}}
    - {event: {dataset: linux.auth, action: unverified-log-entry}}
    - {event: {dataset: windows.security, action: user-created}}

auth_privileged_group:
  match:
    - {event: {dataset: linux.auth, action: group-member-added}, group: {name: sudo}}
    - {event: {dataset: linux.auth, action: group-member-added}, group: {name: siem-asset-admin}}
  no_match:
    - {event: {dataset: linux.auth, action: group-member-added}, group: {name: users}}
    - {event: {dataset: linux.auth, action: group-member-removed}, group: {name: sudo}}
    - {event: {dataset: linux.auth, action: unverified-log-entry}, group: {name: sudo}}

cron_crontab_changed:
  match:
    - {event: {dataset: linux.cron, action: crontab-replaced}}
    - {event: {dataset: linux.cron, action: crontab-deleted}}
  no_match:
    - {event: {dataset: linux.cron, action: crontab-listed}}
    - {event: {dataset: linux.cron, action: scheduled-task-run}}

system_siem_service_failed:
  match:
    - {event: {dataset: linux.system, action: service-failed}, service: {name: vector}}
    - {event: {dataset: linux.system, action: service-failed}, service: {name: siem-detector}}
  no_match:
    - {event: {dataset: linux.system, action: service-stopped}, service: {name: vector}}
    - {event: {dataset: linux.system, action: service-failed}, service: {name: snapd}}
    - {event: {dataset: linux.system, action: unverified-log-entry}, service: {name: vector}}

package_installed:
  match:
    - {event: {dataset: linux.package, action: package-installed}, package: {name: 'sl:amd64'}}
  no_match:
    - {event: {dataset: linux.package, action: package-upgraded}, package: {name: 'curl:amd64'}}
    - {event: {dataset: linux.package, action: package-removed}}

linux_auth_burst:
  match:
    - - {'@timestamp': '2026-11-01T10:00:00.000Z', event: {id: a1, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: alice, target: {name: alice}}}
      - {'@timestamp': '2026-11-01T10:00:30.000Z', event: {id: a2, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: alice, target: {name: alice}}}
      - {'@timestamp': '2026-11-01T10:01:00.000Z', event: {id: a3, dataset: linux.auth, action: ssh-login-failed}, host: {name: h-wsl}, user: {name: alice}}
      - {'@timestamp': '2026-11-01T10:01:30.000Z', event: {id: a4, dataset: linux.auth, action: su-failed}, host: {name: h-wsl}, user: {name: alice}}
      - {'@timestamp': '2026-11-01T10:02:00.000Z', event: {id: a5, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: alice, target: {name: alice}}}
  no_match:
    - - {'@timestamp': '2026-11-01T10:00:00.000Z', event: {id: b1, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: alice}}
      - {'@timestamp': '2026-11-01T10:00:30.000Z', event: {id: b2, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: alice}}
      - {'@timestamp': '2026-11-01T10:01:00.000Z', event: {id: b3, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: bob}}
      - {'@timestamp': '2026-11-01T10:01:30.000Z', event: {id: b4, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: bob}}
      - {'@timestamp': '2026-11-01T10:20:00.000Z', event: {id: b5, dataset: linux.auth, action: pam-auth-failed}, host: {name: h-wsl}, user: {name: alice}}
