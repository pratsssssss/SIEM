    - {event: {dataset: windows.taskscheduler, code: '106'}, file: {path: '\Test'}}
  no_match:
    - {event: {dataset: windows.taskscheduler, code: '140'}, file: {path: '\Test'}}
    - {event: {dataset: windows.taskscheduler, code: '141'}, file: {path: '\Test'}}

proc_schtasks_create:
  match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\schtasks.exe', command_line: 'schtasks /CREATE /tn a /tr "cmd /c x" /sc once'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\schtasks.exe', command_line: 'schtasks /create /tn a /tr C:\Users\Public\x.exe /sc once'}}
  no_match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\schtasks.exe', command_line: 'schtasks /query /tn cmd'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\schtasks.exe', command_line: 'schtasks /create /tn a /tr C:\Program\b.exe /sc once'}}

reg_run_key:
  match:
    - {event: {dataset: windows.sysmon, code: '13'}, registry: {key: 'HKU\S-1-5-21\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\Test'}}
    - {event: {dataset: windows.sysmon, code: '13'}, registry: {key: 'HKLM\software\microsoft\windows\currentversion\runonce\Test'}}
  no_match:
