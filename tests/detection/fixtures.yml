  no_match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\notepad.exe', parent: {executable: 'C:\Windows\System32\fodhelper.exe'}}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\cmd.exe', parent: {executable: 'C:\Windows\System32\svchost.exe'}}}

proc_privilege_discovery:
  match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\whoami.exe', command_line: 'whoami /PRIV'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\whoami.exe', command_line: 'whoami /groups'}}
  no_match:
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\whoami.exe', command_line: 'whoami'}}
    - {event: {dataset: windows.sysmon, code: '1'}, process: {executable: 'C:\Windows\System32\cmd.exe', command_line: 'cmd /all'}}

sys_new_service:
  match:
    - {event: {dataset: windows.system, code: '7045'}, service: {name: Test}, file: {path: 'C:\Program Files\a.exe'}}
  no_match:
    - {event: {dataset: windows.system, code: '7040'}, service: {name: Test}}
    - {event: {dataset: windows.security, code: '7045'}}

sys_service_shell_path:
  match:
    - {event: {dataset: windows.system, code: '7045'}, file: {path: 'C:\Windows\System32\CMD.EXE /c exit'}}
    - {event: {dataset: windows.system, code: '7045'}, file: {path: 'C:\Users\a\AppData\Local\x.exe'}}
  no_match:
