title: Sudo Refused On The Linux Host
id: d3b07a10-5c1e-4f6a-9b2c-0e1f2a3b4c01
status: experimental
description: sudo refused a request, after a wrong password or because the account may not use it.
author: SIEM project
date: 2026-11-01
tags:
    - attack.privilege-escalation
    - attack.t1548.003
logsource:
    product: linux
    service: auth
detection:
    refused:
        Action:
            - sudo-auth-failed
            - sudo-not-permitted
    condition: refused
falsepositives:
    - A mistyped password.
level: medium
