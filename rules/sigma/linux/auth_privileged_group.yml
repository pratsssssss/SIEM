title: Account Added To A Privileged Linux Group
id: d3b07a10-5c1e-4f6a-9b2c-0e1f2a3b4c04
status: experimental
description: An account was added to a group that grants administration, or control of the SIEM.
author: SIEM project
date: 2026-11-01
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1098
logsource:
    product: linux
    service: auth
detection:
    added:
        Action: group-member-added
    privileged:
        Group:
            - sudo
            - adm
            - root
            - shadow
            - disk
            - systemd-journal
            - siem-asset-admin
            - siem-analyst
    condition: added and privileged
falsepositives:
    - Planned administration.
level: high
