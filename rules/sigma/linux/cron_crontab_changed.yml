title: User Crontab Changed On The Linux Host
id: d3b07a10-5c1e-4f6a-9b2c-0e1f2a3b4c05
status: experimental
description: A user crontab was replaced, edited or deleted. Files under /etc/cron.d are not covered, because nothing logs a change to them.
author: SIEM project
date: 2026-11-01
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.003
logsource:
    product: linux
    service: cron
detection:
    changed:
        Action:
            - crontab-replaced
            - crontab-edited
            - crontab-deleted
    condition: changed
falsepositives:
    - Planned administration.
level: medium
