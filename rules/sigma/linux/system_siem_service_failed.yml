title: SIEM Service Failed
id: d3b07a10-5c1e-4f6a-9b2c-0e1f2a3b4c06
status: experimental
description: A service that collects, carries or analyses security data failed. A planned stop does not match. A crash or a forced kill does.
author: SIEM project
date: 2026-11-01
tags:
    - attack.defense-evasion
    - attack.t1562.001
logsource:
    product: linux
    service: system
detection:
    failed:
        Action: service-failed
    siem:
        Service:
            - vector
            - kafka
            - opensearch
            - seal-verifier
            - siem-detector
            - siem-enricher
            - siem-correlator
            - siem-asset
            - siem-linux-agent
    condition: failed and siem
falsepositives:
    - A service that ran out of memory, or crashed on its own.
    - A resilience test.
level: high
