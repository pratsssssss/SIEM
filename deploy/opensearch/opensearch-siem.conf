# Drop-in for opensearch.service. Installed to /etc/systemd/system/opensearch.service.d/siem.conf.
[Unit]
PartOf=siem.target
# Deliberate starts count too, so this allows normal use and still stops a crash loop.
StartLimitIntervalSec=600
StartLimitBurst=6

[Service]
LimitNOFILE=65536
LimitMEMLOCK=infinity
TimeoutStartSec=180
TimeoutStopSec=120
Restart=on-failure
RestartSec=30
ExecStartPost=/usr/local/lib/siem/wait-opensearch.sh
