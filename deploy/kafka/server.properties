# Single-node KRaft broker and controller. Loopback only. See docs/operations/kafka-deployment.md.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093

# Windows and WSL2 clients share one listener, because both reach it at 127.0.0.1:9092.
listeners=CLIENT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=CLIENT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
listener.security.protocol.map=CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=CLIENT
controller.listener.names=CONTROLLER

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

log.dirs=/home/linux/siem/data/kafka
num.partitions=1
num.recovery.threads.per.data.dir=2
auto.create.topics.enable=false

offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

log.retention.hours=72
# retention.bytes never removes the active segment, so segments stay well below topic limits.
log.segment.bytes=104857600
log.retention.check.interval.ms=300000
